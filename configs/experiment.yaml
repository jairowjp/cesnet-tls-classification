# =============================================================================
# Configuración única del experimento
# -----------------------------------------------------------------------------
# Todos los scripts, notebooks y la aplicación leen este archivo. Cambiar un
# valor aquí lo cambia en todo el proyecto, sin tocar el código.
# =============================================================================

semilla: 42                      # fija todo lo aleatorio: muestreo, particiones y entrenamiento

datos:
  fuente: "Zenodo, doi:10.5281/zenodo.10608607 (CC BY 4.0)"
  zip: datasets/CESNET-TLS-Year22.zip
  servicemap: datasets/servicemap.csv
  muestra: data/processed/muestra_2pct   # generada por scripts/01_extraer_muestra.py
  fraccion_muestra: 0.02                 # misma proporción que la submuestra XS de DataZoo
  meses:
    entrenamiento: "2022-09"             # 20 % se separa para validación
    prueba: "2022-10"
    deriva: ["2022-11", "2022-12"]
  fraccion_validacion: 0.2
  etiqueta: CATEGORY                     # 23 categorías, confirmadas en el EDA
  longitud_secuencia: 30

# Campos que NUNCA entran al modelo (evidencia en el EDA, sección 2.10)
excluidos:
  TLS_SNI: fuente de la etiqueta
  TLS_JA3: identifica al cliente
  SRC_IP: identifica usuarios
  DST_IP: identifica servidores
  DST_ASN: fuga de información (NMI 0,430 frente a 0,080 de PPI_LEN)
  DST_PORT: constante (443)
  PROTOCOL: constante (TCP)
  APP: etiqueta fina, no es entrada
  TIME_FIRST: solo para particionar

modelos:
  # ---------------------------------------------------------------------------------------------------
  # Versión 2 (octubre de 2026): ajustes validados por el diagnóstico de sobreajuste y subajuste de la
  # semana 3 (results/diagnostico/). La versión 1 se conserva al final de esta sección y sus resultados en
  # results/modelos_v1/. Un modelo v2 solo reemplaza al v1 si mejora el F1 macro de VALIDACIÓN.
  # ---------------------------------------------------------------------------------------------------
  # Random Forest: estaba en subajuste. Las curvas de validación mostraron que el F1 cae al aumentar
  # min_samples_leaf (1 → 0,818; 10 → 0,673) y que max_depth se estabiliza desde 20. Con hojas de 1 flujo
  # el modelo crece mucho. Prueba piloto (160 000 flujos): 26 987 nodos por árbol; proyección con 640 000 flujos:
  # 8,9 GB con 150 árboles (margen ~1 GB) y 7,9 GB con 100 (margen ~2 GB). Se eligen 100 árboles.
  random_forest: {n_estimators: 100, max_depth: 20, min_samples_leaf: 1, max_samples: 0.5, max_features: sqrt, n_jobs: -1}
  # XGBoost: diagnóstico mixto (seguía mejorando en la ronda 391 de 400 y con brecha de 0,105). Más rondas con
  # parada temprana atienden el subajuste; el submuestreo y L2 contienen la brecha.
  xgboost: {n_estimators: 1000, max_depth: 8, learning_rate: 0.1, tree_method: hist, early_stopping_rounds: 30,
            subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 5.0, min_child_weight: 5, n_jobs: -1}
  # Redes profundas: ambas en subajuste (mejor época = última). Más épocas, tasa OneCycle (sube y luego baja,
  # ayuda a converger) y paciencia 6 para que la parada temprana no corte una mejora lenta.
  cnn1d: {canales: [64, 128], kernel: 3, dropout: 0.2, epocas: 50, lr: 0.001, programador: onecycle, paciencia: 6}
  transformer: {d_model: 64, cabezas: 4, capas: 2, ff: 128, dropout: 0.1, epocas: 40, lr: 0.0005, programador: onecycle,
                paciencia: 6}
  lstm: {unidades: 128, capas: 1, dropout: 0.2, epocas: 15, lr: 0.001}   # opcional (no comprometido)

# Versión 1 (septiembre de 2026): configuración original. Sus resultados están en results/modelos_v1/ y es el punto
# de partida ("antes") del diagnóstico de la semana 3 (scripts/09_diagnostico.py), que así sigue siendo reproducible.
modelos_v1:
  random_forest: {n_estimators: 150, max_depth: 25, min_samples_leaf: 10, max_samples: 0.5, max_features: sqrt, n_jobs: -1}
  xgboost: {n_estimators: 400, max_depth: 8, learning_rate: 0.1, tree_method: hist, early_stopping_rounds: 30, n_jobs: -1}
  cnn1d: {canales: [64, 128], kernel: 3, dropout: 0.2, epocas: 15, lr: 0.001}
  transformer: {d_model: 64, cabezas: 4, capas: 2, ff: 128, dropout: 0.1, epocas: 15, lr: 0.0005}

entrenamiento_profundo:
  lote: 1024          # flujos por paso de optimización
  paciencia: 3        # épocas sin mejorar el F1 macro de validación antes de detenerse

umbrales:                                # comprometidos en la Presentación del Proyecto
  f1_macro_minimo: 0.70
  f1_macro_excelencia: 0.85
  latencia_ms_maxima: 10
  alfa_mcnemar: 0.05
  sus_minimo: 68
