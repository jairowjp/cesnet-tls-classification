# =============================================================================
# Configuración única del experimento
# -----------------------------------------------------------------------------
# Todos los scripts, notebooks y la aplicación leen este archivo. Cambiar un
# valor aquí lo cambia en todo el proyecto, sin tocar el código.
# =============================================================================

semilla: 42                      # fija todo lo aleatorio: muestreo, particiones y entrenamiento

datos:
  fuente: "Zenodo, doi:10.5281/zenodo.10608607 (CC BY 4.0)"
  zip: datasets/CESNET-TLS-Year22.zip
  servicemap: datasets/servicemap.csv
  muestra: data/processed/muestra_2pct   # generada por scripts/01_extraer_muestra.py
  fraccion_muestra: 0.02                 # misma proporción que la submuestra XS de DataZoo
  meses:
    entrenamiento: "2022-09"             # 20 % se separa para validación
    prueba: "2022-10"
    deriva: ["2022-11", "2022-12"]
  fraccion_validacion: 0.2
  etiqueta: CATEGORY                     # 23 categorías, confirmadas en el EDA
  longitud_secuencia: 30

# Campos que NUNCA entran al modelo (evidencia en el EDA, sección 2.10)
excluidos:
  TLS_SNI: fuente de la etiqueta
  TLS_JA3: identifica al cliente
  SRC_IP: identifica usuarios
  DST_IP: identifica servidores
  DST_ASN: fuga de información (NMI 0,430 frente a 0,080 de PPI_LEN)
  DST_PORT: constante (443)
  PROTOCOL: constante (TCP)
  APP: etiqueta fina, no es entrada
  TIME_FIRST: solo para particionar

modelos:
  # Random Forest acotado a propósito. Con 23 clases, scikit-learn guarda 23 valores por nodo:
  # 300 árboles sin límite entrenados con ~640 000 flujos superarían la RAM del equipo (16 GB).
  # Con estos límites (150 árboles, hojas de ≥ 10 flujos, cada árbol ve el 50 % de los datos)
  # el modelo cabe en unos 2 GB de memoria. El ajuste fino se hace en el Sprint 3 (US-12).
  random_forest: {n_estimators: 150, max_depth: 25, min_samples_leaf: 10, max_samples: 0.5, max_features: sqrt, n_jobs: -1}
  # XGBoost: hasta 400 árboles; se detiene antes si la validación no mejora en 30 rondas seguidas.
  xgboost: {n_estimators: 400, max_depth: 8, learning_rate: 0.1, tree_method: hist, early_stopping_rounds: 30, n_jobs: -1}
  # Redes profundas (rama B): reciben la secuencia de 30 paquetes (30 × 3). Se entrenan con la misma
  # partición, los mismos pesos por clase y parada temprana sobre el F1 macro de validación.
  cnn1d: {canales: [64, 128], kernel: 3, dropout: 0.2, epocas: 15, lr: 0.001}
  transformer: {d_model: 64, cabezas: 4, capas: 2, ff: 128, dropout: 0.1, epocas: 15, lr: 0.0005}
  lstm: {unidades: 128, capas: 1, dropout: 0.2, epocas: 15, lr: 0.001}   # opcional (no comprometido)

entrenamiento_profundo:
  lote: 1024          # flujos por paso de optimización
  paciencia: 3        # épocas sin mejorar el F1 macro de validación antes de detenerse

umbrales:                                # comprometidos en la Presentación del Proyecto
  f1_macro_minimo: 0.70
  f1_macro_excelencia: 0.85
  latencia_ms_maxima: 10
  alfa_mcnemar: 0.05
  sus_minimo: 68
